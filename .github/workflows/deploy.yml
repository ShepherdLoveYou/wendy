name: Deploy encrypted site to GitHub Pages

on:
  push:
    branches: ["main"]
  schedule:
    # 每天 4 次刷新"今日待办"（UTC 时间；括号里是太平洋夏令时）
    - cron: "5 7 * * *"    # 00:05
    - cron: "0 13 * * *"   # 06:00
    - cron: "0 19 * * *"   # 12:00
    - cron: "0 1 * * *"    # 18:00
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: assistant/requirements.txt

      - name: Install Python deps
        run: pip install -r assistant/requirements.txt -r tests/requirements.txt

      # 先用假数据把状态机和不变量全测一遍；测试不过就不部署，线上保留上一个好的版本
      - name: Test
        run: pytest -q tests

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      # 快照存在网站本身：取回上一份（加密的）页面和历史快照，在这台临时机器上解密，只用来算"和上次比的变化"
      - name: Restore last snapshot from the live site
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          python assistant/snapshot.py fetch --base "$BASE_URL" --prev-dir _prev --archive-dir _site/today/archive
          if [ -f _prev/index.html ]; then
            npx --yes staticrypt@3 _prev/index.html --decrypt -p "$SITE_PASSWORD" -d _prev/plain >/dev/null 2>&1 \
              || echo "上一份快照解密失败（比如改过口令），这次不做对比"
          fi

      # 课表和明文页面只存在于这台临时机器上，不会提交到公开仓库
      - name: Build today page (Canvas + schedule + AI brief)
        env:
          CANVAS_TOKEN: ${{ secrets.CANVAS_TOKEN }}
          SCHEDULE_TOML: ${{ secrets.SCHEDULE_TOML }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}   # 可选：翻译、理解公告、今日简报智能体
          BASE_URL: ${{ steps.pages.outputs.base_url }}
          PYDANTIC_AI_NO_BANNER: "1"
        run: |
          if [ -n "$SCHEDULE_TOML" ]; then printf '%s\n' "$SCHEDULE_TOML" > assistant/schedule.toml; fi
          BASE_PATH=$(python -c "import os,urllib.parse;print(urllib.parse.urlparse(os.environ['BASE_URL']).path.rstrip('/'))")
          python assistant/build_today.py --out _build/today/index.html \
            --prev _prev/plain/index.html --archive-dates _prev/archive.json \
            --archive-base "$BASE_PATH/today/archive/"

      - name: Encrypt and assemble site
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: |
          test -n "$SITE_PASSWORD" || { echo "::error::缺少 SITE_PASSWORD secret"; exit 1; }
          mkdir -p _site/today
          cp index.html _site/index.html
          touch _site/.nojekyll
          npx --yes staticrypt@3 _build/today/index.html -d _site/today \
            -p "$SITE_PASSWORD" --short --remember 30 \
            --template-title "Wendy · 今日待办" \
            --template-instructions "输入口令查看今天要做的事" \
            --template-button "打开" \
            --template-placeholder "口令" \
            --template-remember "30 天内记住我" \
            --template-error "口令不对" \
            --template-color-primary "#2d6cdf"
          test -s _site/today/index.html
          # 这次的（加密）页面存成当天的快照，保留最近 30 天
          python assistant/snapshot.py add --site-dir _site/today --date "$(TZ=America/Los_Angeles date +%F)" --keep 30

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # 公开仓库 60 天没有提交，GitHub 会停用定时任务；这里在每次定时运行时通过 API 提前续期（不产生提交）
  workflow-keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@v1
