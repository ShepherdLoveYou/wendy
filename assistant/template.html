<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wendy 的今日</title>
<script>
  // 跟随系统的深色模式：Tabler 读 data-bs-theme，FullCalendar 读 data-color-scheme
  (function () {
    var dark = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.setAttribute("data-bs-theme", dark ? "dark" : "light");
    document.documentElement.setAttribute("data-color-scheme", dark ? "dark" : "light");
  })();
</script>
<!-- 开源套件：Tabler（MIT）、Tabler Icons（MIT）、FullCalendar（MIT） -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.6.1/dist/css/tabler.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.48.0/dist/tabler-icons.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@7.1.0/skeleton.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@7.1.0/themes/forma/theme.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@7.1.0/themes/forma/palettes/blue.css">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@7.1.0/all/global.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@7.1.0/themes/forma/global.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@7.1.0/locales/zh-cn/global.js"></script>
<style>
  /* 只补 Tabler 没有的几处 */
  .min-w-0 { min-width: 0; }
  .time-col { min-width: 3.5rem; }
  .nav-sticky { position: sticky; top: 0; z-index: 1020; margin: 1rem -.75rem 0; padding: .5rem .75rem;
    background: color-mix(in srgb, var(--tblr-body-bg) 85%, transparent);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); overflow-x: auto; }
  .nav-sticky .nav { flex-wrap: nowrap; }
  .nav-sticky .nav-link { white-space: nowrap; }
  section[id] { scroll-margin-top: 4.5rem; }
  .next .card-status-start { background: var(--c, var(--tblr-border-color)); }
  .next .next-big { color: var(--c, inherit); font-variant-numeric: tabular-nums; }
  .cd { font-variant-numeric: tabular-nums; min-width: 5.5rem; }
  .task.done .title, .task.checked .title { text-decoration: line-through; opacity: .5; }
  .task.checked .cd { opacity: .35; }
  .cls.past { opacity: .45; }
  .preview { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
    cursor: pointer; white-space: pre-line; }
  .preview.open { display: block; }
  #calendar .deadline { font-weight: 600; }
  .term-progress { width: 9rem; }
  /* 魔法猫猫小提示：文字叠在图片右下角的空白处（位置沿用原表情包网页） */
  .meme { position: relative; max-width: 560px; aspect-ratio: 1170 / 792; container-type: inline-size;
    background: #fff var(--cat) center / 100% 100% no-repeat; border: 1px solid var(--tblr-border-color);
    border-radius: 12px; overflow: hidden; }
  .meme-cap { position: absolute; left: 38.4%; top: 69.4%; width: 57.5%; height: 20%; display: grid;
    align-content: center; justify-items: center; color: #111; font-weight: 500; font-size: 4.7cqw; line-height: 1.28;
    white-space: nowrap; font-family: "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif; }
  .meme-num { font-variant-numeric: tabular-nums; }
  .meme-foot { max-width: 560px; }
  @media (max-width: 575.98px) { .cd { min-width: 4.5rem; } .page-title { font-size: 1.5rem; } }
</style>
</head>
<body>
<div class="page">
  <div class="page-wrapper">
    <div class="page-body mt-3">
      <div class="container-xl">
<div class="alert alert-info mb-3" id="snapshot-note" hidden><i class="ti ti-history"></i>
  这是 <b id="snapshot-date"></b> 的历史快照，内容不会再更新。<a href="../">查看最新的 →</a></div>
{{BODY}}
      </div>
    </div>
  </div>
</div>
<script type="application/json" id="data">{{DATA}}</script>
<script>
(function () {
  var D = { classes: [], tasks: [], calendar: { events: [] } };
  try { D = JSON.parse(document.getElementById("data").textContent); } catch (e) {}
  var WD = ["周日", "周一", "周二", "周三", "周四", "周五", "周六"];
  var BADGES = ["bg-red-lt", "bg-orange-lt", "bg-blue-lt", "bg-secondary-lt", "bg-green-lt"];

  var ls = null; try { ls = window.localStorage; } catch (e) {}
  function get(k) { try { return ls && ls.getItem(k); } catch (e) { return null; } }
  function put(k, v) { try { v ? ls.setItem(k, "1") : ls.removeItem(k); } catch (e) {} }
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  // 所有钟点一律按加州时间显示：家人在别的时区打开也不会看错
  var TZ = "America/Los_Angeles";
  var HM = new Intl.DateTimeFormat("en-GB", { timeZone: TZ, hour: "2-digit", minute: "2-digit", hour12: false });
  var YMD = new Intl.DateTimeFormat("en-CA", { timeZone: TZ });
  var WDAY = new Intl.DateTimeFormat("zh-CN", { timeZone: TZ, weekday: "short" });
  function hhmm(t) { return HM.format(new Date(t)); }
  function fmt(ms) {
    var s = Math.floor(Math.abs(ms) / 1000), d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600),
        m = Math.floor(s % 3600 / 60), x = s % 60;
    return d ? d + "天" + h + "小时" : h ? h + "小时" + m + "分" : m + "分" + pad(x) + "秒";
  }
  function relDay(t) {
    var n = Math.round((Date.parse(YMD.format(new Date(t))) - Date.parse(YMD.format(new Date()))) / 864e5);
    return n === 0 ? "今天" : n === 1 ? "明天" : n === 2 ? "后天" : WDAY.format(new Date(t));
  }
  function badgeFor(ms) { return ms < 864e5 ? "bg-red-lt" : ms < 2592e5 ? "bg-orange-lt" : ms < 6048e5 ? "bg-blue-lt" : "bg-secondary-lt"; }
  function setBadge(el, cls) { BADGES.forEach(function (b) { el.classList.remove(b); }); el.classList.add(cls); }

  // 打开的是 archive/2026-09-28.html 这种历史快照时，顶部提示一下
  var snap = location.pathname.match(/\/archive\/(\d{4})-(\d{2})-(\d{2})\.html$/);
  if (snap) { document.getElementById("snapshot-date").textContent = +snap[2] + " 月 " + +snap[3] + " 日";
    document.getElementById("snapshot-note").hidden = false; }

  var greet = document.getElementById("greet");
  if (greet) { var h = new Date().getHours();
    greet.textContent = h < 5 ? "夜深了，早点休息" : h < 11 ? "早上好" : h < 13 ? "中午好" : h < 18 ? "下午好" : "晚上好"; }

  // "下一节课 / 最近的截止"卡片：打开页面时现算，页面生成得再早也是准的
  function setNext(id, color, big, title, url, meta) {
    var el = document.getElementById(id); if (!el) return;
    el.style.setProperty("--c", color || "");
    el.querySelector(".next-big").textContent = big;
    var t = el.querySelector(".next-title"); t.textContent = "";
    if (url) { var a = document.createElement("a"); a.href = url; a.target = "_blank"; a.rel = "noopener";
      a.className = "text-reset"; a.textContent = title; t.appendChild(a); } else t.textContent = title;
    el.querySelector(".next-meta").textContent = meta;
  }
  function renderNext(now) {
    var c = (D.classes || []).filter(function (x) { return new Date(x.end) > now; })[0];
    if (c) {
      var a = new Date(c.start) - now;
      setNext("next-class", c.color, a > 0 ? fmt(a) + " 后开始" : "上课中 · 还剩 " + fmt(new Date(c.end) - now),
        c.course + " " + c.kind, "", relDay(c.start) + " " + hhmm(c.start) + "–" + hhmm(c.end) + (c.where ? " · " + c.where : ""));
    } else setNext("next-class", "", "—", "这周没有更多课了", "", "");
    var t = (D.tasks || []).filter(function (x) { return new Date(x.due) > now && !(x.manual && get("wendy-done:" + x.id)); })[0];
    if (t) setNext("next-due", t.color, "还剩 " + fmt(new Date(t.due) - now), t.title, t.url,
      t.course + " · " + relDay(t.due) + " " + hhmm(t.due) + " 截止");
    else setNext("next-due", "", "—", "近期没有要交的 🎉", "", "");
  }

  // 魔法猫猫小提示：整数周，从加州时间 1 月 1 日零点算，跨年自动换成新的一年
  function renderMeme(now) {
    var M = D.meme, el = document.getElementById("meme");
    if (!M || !M.start || !el) return;
    var y = M.year, start = M.start, end = M.next;
    if (now >= M.next) { y += 1; start = M.next; end = M.next + 365 * 864e5; }
    var ms = now - start, weeks = Math.floor(ms / 6048e5), days = Math.floor(ms % 6048e5 / 864e5);
    var pct = Math.min(100, ms / (end - start) * 100);
    document.querySelector(".meme-year").textContent = y;
    document.querySelector(".meme-num").textContent = weeks;
    document.querySelector(".meme-elapsed").textContent = weeks + " 周 " + days + " 天";
    document.querySelector(".meme-pct").textContent = pct.toFixed(1) + "%";
    document.querySelector(".meme-bar").style.width = pct.toFixed(2) + "%";
    el.setAttribute("aria-label", "小提示：你已经在" + y + "浪费了" + weeks + "个星期了");
  }

  function tick() {
    var now = Date.now();
    renderMeme(now);
    document.querySelectorAll(".task[data-due]:not(.done)").forEach(function (li) {
      var ms = new Date(li.dataset.due) - now, b = li.querySelector(".cd");
      if (b) { b.textContent = ms < 0 ? "已截止" : fmt(ms); setBadge(b, badgeFor(ms)); }
    });
    document.querySelectorAll(".cls[data-start]").forEach(function (li) {
      var a = new Date(li.dataset.start) - now, e = new Date(li.dataset.end) - now, b = li.querySelector(".cd"),
          dot = li.querySelector(".status-dot"), live = a <= 0 && e > 0;
      li.classList.toggle("past", e <= 0);
      if (dot) dot.classList.toggle("status-dot-animated", live);
      if (b) { b.textContent = a > 0 ? fmt(a) + "后" : live ? "上课中" : "已结束";
        setBadge(b, live ? "bg-green-lt" : a > 0 && a < 36e5 ? "bg-orange-lt" : "bg-secondary-lt"); }
    });
    renderNext(now);
  }

  // Canvas 之外的任务（Top Hat、iMath…）：完成状态只存在这台设备上
  document.querySelectorAll(".tick").forEach(function (box) {
    var li = box.closest(".task"), key = "wendy-done:" + box.dataset.key;
    box.checked = !!get(key); li.classList.toggle("checked", box.checked);
    box.addEventListener("change", function () {
      li.classList.toggle("checked", box.checked); put(key, box.checked); renderNext(Date.now());
    });
  });
  document.querySelectorAll(".preview").forEach(function (p) {
    p.addEventListener("click", function () { p.classList.toggle("open"); });
  });

  // 吸顶导航：滚到哪一节就高亮哪一个
  var links = document.querySelectorAll(".nav-sticky .nav-link");
  if ("IntersectionObserver" in window) {
    var io = new IntersectionObserver(function (es) {
      es.forEach(function (e) { if (e.isIntersecting) links.forEach(function (a) {
        a.classList.toggle("active", a.getAttribute("href") === "#" + e.target.id); }); });
    }, { rootMargin: "-40% 0px -55% 0px" });
    document.querySelectorAll("section[id]").forEach(function (s) { io.observe(s); });
  }

  // 课程表：FullCalendar 周视图；手机上默认日视图
  var el = document.getElementById("calendar");
  if (el && window.FullCalendar) {
    var cal = D.calendar || {}, narrow = window.matchMedia("(max-width: 640px)").matches;
    var calendar = new FullCalendar.Calendar(el, {
      locale: "zh-cn",
      timeZone: TZ,
      initialView: narrow ? "timeGridDay" : "timeGridWeek",
      headerToolbar: { left: "prev,next today", center: "title", right: narrow ? "timeGridDay,listWeek" : "timeGridWeek,listWeek" },
      allDaySlot: true,
      allDayText: "截止",
      nowIndicator: true,
      height: "auto",
      slotMinTime: cal.slotMinTime || "08:00:00",
      slotMaxTime: cal.slotMaxTime || "19:00:00",
      hiddenDays: cal.hiddenDays || [],
      events: cal.events || [],
      eventClick: function (info) {
        if (info.event.url) { info.jsEvent.preventDefault(); window.open(info.event.url, "_blank", "noopener"); }
      }
    });
    calendar.render();
  }

  tick(); setInterval(tick, 1000);
})();
</script>
</body>
</html>
