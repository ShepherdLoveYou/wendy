# 示例配置（不含个人信息）。真实配置放在 assistant/schedule.toml（已被 git 忽略），
# 用 `mise run schedule-upload` 上传到 GitHub Secret SCHEDULE_TOML，云端生成页面时使用。
#
# 上课时间和教室不用填：脚本会根据 Canvas 上的班号，自动去 UCR 选课系统读取。

[term]
# 可选：name / week1_monday / last_class_day 不写就从选课系统自动推算
holidays = ["2026-11-11", "2026-11-26", "2026-11-27"]

# Canvas 课程 id → 页面上显示的名字（可选，和选课系统的"科目 课号"保持一致）
[courses]
"123456" = "MATH 001"

# 给自动读到的课加备注：按 课程 + 类型开头 匹配
# 可以加 note（备注）、link（Zoom 等链接）、from / until（改开始、结束日期）、where（改地点）
[[notes]]
course = "MATH 001"
kind = "讨论课"
link = "https://example.zoom.us/j/123"
from = "2026-10-01"
note = "可选备注"

# 手动添加的额外日程（社团、打工……），会和课表合在一起显示
[[classes]]
course = "社团"
kind = "例会"
days = ["Wed"]
start = "18:00"
end = "19:00"
where = "Building 101"

# Canvas 读不到的固定作业（Top Hat、iMath 之类），按规律生成
[[recurring]]
course = "MATH 001"
title = "网上作业"
platform = "Homework site"
weekday = "Fri"
due = "23:59"
from = "2026-10-02"
until = "2026-12-04"
url = "https://example.com"
note = "可选备注"
